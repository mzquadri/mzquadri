<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How the work is shaped: data, model, uncertainty, service.">
<defs>
  <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
  </linearGradient>
  <linearGradient id="line-light" gradientUnits="userSpaceOnUse"
                  x1="128" y1="0" x2="848" y2="0">
    <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow-light" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots-light" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#e2e8f0"/>
  </pattern>
</defs>
<rect width="980" height="240" rx="18" fill="url(#bg-light)"/>
<rect width="980" height="240" rx="18" fill="url(#dots-light)" opacity="0.55"/>
<rect x="0.5" y="0.5" width="979" height="239" rx="18" fill="none" stroke="#dde3ea"/>
<path d="M128 104 H848" fill="none" stroke="#dde3ea" stroke-width="3" stroke-linecap="round"/>
<path d="M128 104 H848" fill="none" stroke="url(#line-light)" stroke-width="3" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="720"><animate attributeName="stroke-dashoffset" from="720" to="0" dur="1.6s" fill="freeze"/></path>
<circle r="7" fill="#2dd4bf" filter="url(#glow-light)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="8.0s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="cx" values="128;848" dur="8.0s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/><animate attributeName="cy" values="104;104" dur="8.0s" begin="1.6s" repeatCount="indefinite"/></circle>
<circle cx="128" cy="104" r="30" fill="#ffffff" stroke="#dde3ea" stroke-width="2"/><circle cx="128" cy="104" r="30" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0.25" keyTimes="0;0.04;0.3;1" dur="8.0s" begin="1.60s" repeatCount="indefinite"/><animate attributeName="r" values="30;36;30" keyTimes="0;0.06;0.2" dur="8.0s" begin="1.60s" repeatCount="indefinite"/></circle>
<text x="128" y="110" fill="#0d9488" font-size="17" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">01</text>
<text x="128" y="166" fill="#0f172a" font-size="19" font-weight="600" text-anchor="middle">Data</text>
<text x="128" y="190" fill="#64748b" font-size="14.5" text-anchor="middle">scenarios, graphs,</text>
<text x="128" y="209" fill="#64748b" font-size="14.5" text-anchor="middle">documents</text>
<circle cx="364" cy="104" r="30" fill="#ffffff" stroke="#dde3ea" stroke-width="2"/><circle cx="364" cy="104" r="30" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0.25" keyTimes="0;0.04;0.3;1" dur="8.0s" begin="4.11s" repeatCount="indefinite"/><animate attributeName="r" values="30;36;30" keyTimes="0;0.06;0.2" dur="8.0s" begin="4.11s" repeatCount="indefinite"/></circle>
<text x="364" y="110" fill="#0d9488" font-size="17" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">02</text>
<text x="364" y="166" fill="#0f172a" font-size="19" font-weight="600" text-anchor="middle">Model</text>
<text x="364" y="190" fill="#64748b" font-size="14.5" text-anchor="middle">train, compare,</text>
<text x="364" y="209" fill="#64748b" font-size="14.5" text-anchor="middle">pick one</text>
<circle cx="606" cy="104" r="30" fill="#ffffff" stroke="#dde3ea" stroke-width="2"/><circle cx="606" cy="104" r="30" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0.25" keyTimes="0;0.04;0.3;1" dur="8.0s" begin="6.61s" repeatCount="indefinite"/><animate attributeName="r" values="30;36;30" keyTimes="0;0.06;0.2" dur="8.0s" begin="6.61s" repeatCount="indefinite"/></circle>
<text x="606" y="110" fill="#0d9488" font-size="17" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">03</text>
<text x="606" y="166" fill="#0f172a" font-size="19" font-weight="600" text-anchor="middle">Uncertainty</text>
<text x="606" y="190" fill="#64748b" font-size="14.5" text-anchor="middle">calibrate, cover,</text>
<text x="606" y="209" fill="#64748b" font-size="14.5" text-anchor="middle">abstain</text>
<circle cx="848" cy="104" r="30" fill="#ffffff" stroke="#dde3ea" stroke-width="2"/><circle cx="848" cy="104" r="30" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0.25" keyTimes="0;0.04;0.3;1" dur="8.0s" begin="9.12s" repeatCount="indefinite"/><animate attributeName="r" values="30;36;30" keyTimes="0;0.06;0.2" dur="8.0s" begin="9.12s" repeatCount="indefinite"/></circle>
<text x="848" y="110" fill="#0d9488" font-size="17" font-weight="700" text-anchor="middle" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">04</text>
<text x="848" y="166" fill="#0f172a" font-size="19" font-weight="600" text-anchor="middle">Service</text>
<text x="848" y="190" fill="#64748b" font-size="14.5" text-anchor="middle">ship it, watch it,</text>
<text x="848" y="209" fill="#64748b" font-size="14.5" text-anchor="middle">retrain it</text>
<text x="490" y="34" fill="#94a3b8" font-size="14" text-anchor="middle" letter-spacing="2.4">HOW THE WORK IS SHAPED</text>
</svg>