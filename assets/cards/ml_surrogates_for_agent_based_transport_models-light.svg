<svg xmlns="http://www.w3.org/2000/svg" width="560" height="188" viewBox="0 0 560 188" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="ml_surrogates: Uncertainty for a GNN traffic surrogate. −82% calibration error, on the protocol that replays.">
<defs>
  <linearGradient id="bg-light0" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
  </linearGradient>
  <linearGradient id="line-light0" gradientUnits="userSpaceOnUse"
                  x1="16" y1="0" x2="544" y2="0">
    <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow-light0" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots-light0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#e2e8f0"/>
  </pattern>
</defs>
<rect width="560" height="188" rx="16" fill="url(#bg-light0)"/>
<rect width="560" height="188" rx="16" fill="url(#dots-light0)" opacity="0.5"/>
<rect x="0.5" y="0.5" width="559" height="187" rx="16" fill="none" stroke="#dde3ea"/>
<path d="M16 2 H544" stroke="url(#line-light0)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="528" stroke-dashoffset="528"><animate attributeName="stroke-dashoffset" from="528" to="0" dur="1.1s" begin="0.00s" fill="freeze"/></path>
<text x="28" y="48" fill="#0f172a" font-size="21" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace" opacity="0">ml_surrogates<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.25s" fill="freeze"/></text>
<text x="28" y="76" fill="#64748b" font-size="16" opacity="0">Uncertainty for a GNN traffic surrogate<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/></text>
<g opacity="0" transform="translate(0,10)"><animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.50s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.55s" begin="0.50s" fill="freeze"/><text x="28" y="136" fill="#0d9488" font-size="46" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">−82%</text></g>
<text x="28" y="158" fill="#94a3b8" font-size="13.5" opacity="0">calibration error, on the protocol that<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.60s" fill="freeze"/></text>
<text x="28" y="176" fill="#94a3b8" font-size="13.5" opacity="0">replays<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.60s" fill="freeze"/></text>
<circle cx="526" cy="44" r="6" fill="#2dd4bf" filter="url(#glow-light0)"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle>
</svg>