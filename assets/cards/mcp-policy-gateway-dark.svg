<svg xmlns="http://www.w3.org/2000/svg" width="560" height="188" viewBox="0 0 560 188" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="mcp-policy-gateway: Policy enforcement for MCP tool calls. 96.2% of an adversarial corpus caught, 9.5% false positives.">
<defs>
  <linearGradient id="bg-dark1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2b"/>
  </linearGradient>
  <linearGradient id="line-dark1" gradientUnits="userSpaceOnUse"
                  x1="16" y1="0" x2="544" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <filter id="glow-dark1" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots-dark1" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#1d293d"/>
  </pattern>
</defs>
<rect width="560" height="188" rx="16" fill="url(#bg-dark1)"/>
<rect width="560" height="188" rx="16" fill="url(#dots-dark1)" opacity="0.5"/>
<rect x="0.5" y="0.5" width="559" height="187" rx="16" fill="none" stroke="#263349"/>
<path d="M16 2 H544" stroke="url(#line-dark1)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="528" stroke-dashoffset="528"><animate attributeName="stroke-dashoffset" from="528" to="0" dur="1.1s" begin="0.12s" fill="freeze"/></path>
<text x="28" y="48" fill="#e8eef7" font-size="21" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace" opacity="0">mcp-policy-gateway<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.37s" fill="freeze"/></text>
<text x="28" y="76" fill="#9aa8bd" font-size="16" opacity="0">Policy enforcement for MCP tool calls<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.47s" fill="freeze"/></text>
<g opacity="0" transform="translate(0,10)"><animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.62s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.55s" begin="0.62s" fill="freeze"/><text x="28" y="136" fill="#5eead4" font-size="46" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">96.2%</text></g>
<text x="28" y="158" fill="#64748b" font-size="13.5" opacity="0">of an adversarial corpus caught, 9.5%<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.72s" fill="freeze"/></text>
<text x="28" y="176" fill="#64748b" font-size="13.5" opacity="0">false positives<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.72s" fill="freeze"/></text>
<circle cx="526" cy="44" r="6" fill="#5eead4" filter="url(#glow-dark1)"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="0.30s" repeatCount="indefinite"/></circle>
</svg>