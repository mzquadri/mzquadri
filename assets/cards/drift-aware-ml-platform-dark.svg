<svg xmlns="http://www.w3.org/2000/svg" width="560" height="188" viewBox="0 0 560 188" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="drift-aware-ml-platform: Forecasting that notices its own staleness. 0.679 target drift while 9% of features move.">
<defs>
  <linearGradient id="bg-dark3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2b"/>
  </linearGradient>
  <linearGradient id="line-dark3" gradientUnits="userSpaceOnUse"
                  x1="16" y1="0" x2="544" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <filter id="glow-dark3" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots-dark3" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#1d293d"/>
  </pattern>
</defs>
<rect width="560" height="188" rx="16" fill="url(#bg-dark3)"/>
<rect width="560" height="188" rx="16" fill="url(#dots-dark3)" opacity="0.5"/>
<rect x="0.5" y="0.5" width="559" height="187" rx="16" fill="none" stroke="#263349"/>
<path d="M16 2 H544" stroke="url(#line-dark3)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="528" stroke-dashoffset="528"><animate attributeName="stroke-dashoffset" from="528" to="0" dur="1.1s" begin="0.36s" fill="freeze"/></path>
<text x="28" y="48" fill="#e8eef7" font-size="21" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace" opacity="0">drift-aware-ml-platform<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.61s" fill="freeze"/></text>
<text x="28" y="76" fill="#9aa8bd" font-size="16" opacity="0">Forecasting that notices its own staleness<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.71s" fill="freeze"/></text>
<g opacity="0" transform="translate(0,10)"><animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.86s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.55s" begin="0.86s" fill="freeze"/><text x="28" y="136" fill="#5eead4" font-size="46" font-weight="700" font-family="Cascadia Mono, SFMono-Regular, Consolas, monospace">0.679</text></g>
<text x="28" y="158" fill="#64748b" font-size="13.5" opacity="0">target drift while 9% of features move<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.96s" fill="freeze"/></text>
